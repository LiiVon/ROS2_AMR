twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      nav2:
        topic: /cmd_vel/nav2
        timeout: 0.5
        priority: 40
      tracking:
        topic: /cmd_vel/tracking
        timeout: 0.5
        priority: 60
      teleop:
        topic: /cmd_vel/teleop
        timeout: 0.5
        priority: 100
    locks:
      manual_takeover:
        topic: /teleop/takeover_lock
        # 有限超时 + 周期心跳：发布者异常退出后锁自动释放，避免导航被永久屏蔽
        timeout: 0.5
        priority: 100
